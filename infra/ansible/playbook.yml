---
- name: Preparar o ambiente R e Shiny do projeto
  hosts: local
  become: true
  tasks:
    - name: Instalar R, painel e ferramentas de teste
      ansible.builtin.apt:
        update_cache: true
        name:
          - git
          - r-base-core
          - r-cran-shiny
          - r-cran-ggplot2
          - r-cran-plotly
          - r-cran-dt
          - r-cran-testthat
        state: present
